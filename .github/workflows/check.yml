name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-test.txt
      - run: npm test
      - run: npm run test:math
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
